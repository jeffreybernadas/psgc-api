# Project identification
sonar.projectKey=psgc-api-key
sonar.projectName=PSGC API
sonar.host.url=${env.SONAR_HOST_URL}

# Source code directories
sonar.sources=src

# Files and directories to exclude from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  src/__tests__/**,\
  src/data/**

# Coverage exclusions (same as jest.config.ts)
sonar.coverage.exclusions=\
  src/scripts/**,\
  src/utils/logger.util.ts,\
  src/index.ts,\
  src/types/**

# Test directories
sonar.tests=src/__tests__

# Test file patterns
sonar.test.inclusions=src/__tests__/**/*.ts
sonar.test.exclusions=src/__tests__/helpers/**

# Coverage report paths
sonar.javascript.lcov.reportPaths=coverage/lcov.info
